name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate extension
        shell: pwsh
        run: .\scripts\validate.ps1
      - name: Test security-critical code
        run: npm test
      - name: Build Web Store package
        run: npm run package
